name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android ফোল্ডার ইত্যাদি CI তেই বানানো হয়, রিপোতে শুধু আপনার lib/ থাকে
      - name: Create Flutter project and add packages
        run: |
          flutter create --org com.techcity --project-name tech_city --platforms android build_app
          cd build_app
          flutter pub add firebase_core firebase_auth cloud_firestore url_launcher firebase_messaging
          rm -rf lib
          cp -r ../lib lib

      - name: Generate Firebase options from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: python3 .github/scripts/gen_firebase_options.py build_app/lib/firebase_options.dart

      - name: Set minSdk to 23
        run: |
          sed -i -E 's/(minSdk(Version)?)( =)? ?flutter\.minSdkVersion/\1\3 23/' build_app/android/app/build.gradle*
          grep -n "minSdk" build_app/android/app/build.gradle*

      - name: Add INTERNET and notification permissions
        run: |
          MF=build_app/android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" "$MF" || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MF"
          grep -q "POST_NOTIFICATIONS" "$MF" || sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application|' "$MF"
          grep -n "uses-permission" "$MF"

      - name: Apply Google services plugin (push notification)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > build_app/android/app/google-services.json
          cd build_app/android
          if grep -q 'id("com.android.application") version' settings.gradle.kts 2>/dev/null && grep -q 'id("com.android.application")' app/build.gradle.kts 2>/dev/null; then
            sed -i '/id("com.android.application") version/a\    id("com.google.gms.google-services") version "4.4.2" apply false' settings.gradle.kts
            sed -i '0,/id("com.android.application")/s//id("com.android.application")\n    id("com.google.gms.google-services")/' app/build.gradle.kts
            grep -n "google-services" settings.gradle.kts app/build.gradle.kts
          else
            echo "::warning::gradle.kts ফাইলে প্লাগইন বসানো যায়নি, পুশ কাজ নাও করতে পারে"
          fi

      - name: Build release APK
        working-directory: build_app
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --build-name=1.0.${{ github.run_number }}
          --dart-define=BUILD_NUMBER=${{ github.run_number }}

      # প্রতিবার একই চাবি (keystore) দিয়ে সাইন না করলে ফোনে আপডেট ইনস্টল হয় না
      - name: Sign APK with fixed key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          SRC=build_app/build/app/outputs/flutter-apk/app-release.apk
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::KEYSTORE_BASE64 / KEYSTORE_PASSWORD secret নেই। এই APK আপডেট হিসেবে ইনস্টল হবে না।"
            cp "$SRC" tech-city.apk
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/keystore.jks" --ks-key-alias techcity \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out tech-city.apk "$SRC"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs tech-city.apk | head -3
          rm -f "$RUNNER_TEMP/keystore.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: tech-city-apk
          path: tech-city.apk

      # পাবলিক ডাউনলোড লিংক: https://github.com/<user>/<repo>/releases/latest/download/tech-city.apk
      - name: Publish release (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest tech-city.apk \
            --target "${{ github.sha }}" \
            --title "Tech City (build ${{ github.run_number }})" \
            --notes "Build ${{ github.run_number }}" --latest
