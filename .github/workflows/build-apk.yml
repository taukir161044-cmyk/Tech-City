name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android ফোল্ডার ইত্যাদি CI তেই বানানো হয়, রিপোতে শুধু আপনার lib/ থাকে
      - name: Create Flutter project and add packages
        run: |
          flutter create --org com.techcity --project-name tech_city --platforms android build_app
          cd build_app
          flutter pub add firebase_core firebase_auth cloud_firestore url_launcher
          rm -rf lib
          cp -r ../lib lib

      - name: Generate Firebase options from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: python3 .github/scripts/gen_firebase_options.py build_app/lib/firebase_options.dart

      - name: Set minSdk to 23
        run: |
          sed -i -E 's/(minSdk(Version)?)( =)? ?flutter\.minSdkVersion/\1\3 23/' build_app/android/app/build.gradle*
          grep -n "minSdk" build_app/android/app/build.gradle*

      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: tech-city-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
